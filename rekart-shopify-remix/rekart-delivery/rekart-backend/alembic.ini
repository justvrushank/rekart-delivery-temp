# Alembic configuration for the Rekart Shopify backend.
# Run from this directory:  alembic upgrade head  /  alembic revision --autogenerate -m "..."

[alembic]
# Location of the migration environment (env.py + versions/).
script_location = migrations

# Make the `app` package importable when Alembic runs (so env.py can import
# app.config / app.models). "." == this directory (rekart-shopify-backend/).
prepend_sys_path = .

# Filename template for newly generated revisions.
file_template = %%(rev)s_%%(slug)s

# Database URL. Read from the DATABASE_URL environment variable via configparser
# interpolation. env.py ALSO overrides this from app.config.Settings (which loads
# .env), so the app and migrations always use the same connection string.
sqlalchemy.url = %(DATABASE_URL)s


# ─── Logging ─────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S